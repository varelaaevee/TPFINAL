
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="perfil.css">
</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <div id="inicioSesion">

                <h1>Bienvenido</h1>

                <p class="subtitulo">Proyecto de Informática</p>

                <div class="linea"></div>

                <h2>Iniciar sesión</h2>

                <p class="descripcion">
                    Ingresá tus datos para acceder al proyecto.
                </p>

                <form onsubmit="iniciarSesion(event)">

                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        placeholder="Escribí tu nombre..."
                        required
                    >

                    <label for="curso">Curso</label>
                    <input
                        type="text"
                        id="curso"
                        placeholder="Ej: 4° año"
                        required
                    >

                    <label for="anio">Año</label>
                    <input
                        type="number"
                        id="anio"
                        placeholder="Ej: 2026"
                        required
                    >

                    <button type="submit">Ingresar</button>

                </form>

                <p class="pie">Proyecto escolar de Informática</p>

            </div>


          
            <div id="perfilUsuario" style="display: none;">

                <h1>Mi Perfil</h1>

                <p class="subtitulo">Proyecto de Informática</p>

                <div class="linea"></div>

                <h2>Mis datos</h2>

                <p class="descripcion">
                    Estos son los datos de tu perfil.
                </p>

                <div class="datos-perfil">
                    <p><strong>Nombre:</strong> <span id="nombreUsuario"></span></p>

                    <p><strong>Curso:</strong> <span id="cursoUsuario"></span></p>

                    <p><strong>Año:</strong> <span id="anioUsuario"></span></p>
                </div>

                <button type="button" onclick="cerrarSesion()">
                    Cerrar sesión
                </button>

                <button type="button" class="boton-secundario"
                    onclick="window.location.href='paginaprincipal.html'">
                    Volver al inicio
                </button>

                <p class="pie">Proyecto escolar de Informática</p>

            </div>

        </div>

    </div>

    <script src="perfil.js"></script>

</body>
</html>
